name: sham_delivery
description: Sham Stores - Driver Delivery App
version: 2.0.0+1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.4.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.2.0
  geolocator: ^11.0.0
  url_launcher: ^6.2.4
  permission_handler: ^11.3.0
  connectivity_plus: ^6.0.3
  intl: ^0.20.2
  cupertino_icons: ^1.0.6
  socket_io_client: ^3.0.0
  font_awesome_flutter: ^10.7.0
  audioplayers: ^6.0.0
  image_picker: ^1.1.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
